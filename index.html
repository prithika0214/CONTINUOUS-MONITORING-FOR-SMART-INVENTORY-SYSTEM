<!DOCTYPE html>
<html>
<head>
    <title>StockPulse Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>StockPulse</h1>

        <p>Continuous Monitoring Smart Inventory</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
