name: StockPulse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Test Database Initialization and Timezone handling
      run: |
        python -c "
        from database.database import init_db, IST
        from datetime import datetime
        init_db()
        now_ist = datetime.now(IST)
        print('Database init passed. Current IST:', now_ist)
        "

    - name: Validate Grocery Dataset exists and has no duplicates
      run: |
        python -c "
        import csv
        with open('data/stockpulse_indian_grocery_dataset.csv', 'r', encoding='utf-8-sig') as f:
            reader = csv.DictReader(f)
            columns = reader.fieldnames
            assert 'product_id' in columns, 'Missing product_id'
            assert 'price_inr' in columns, 'Missing price_inr'
            ids = [row['product_id'] for row in reader]
            assert len(ids) == len(set(ids)), 'Duplicate product_ids found'
        "

    - name: Test Backend API Starts
      run: |
        # Start Flask app in background
        python app.py &
        sleep 5
        # Check API is up
        curl -f http://127.0.0.1:5000/ || exit 1

    - name: Build Docker Image
      run: |
        docker build -t stockpulse-app .
